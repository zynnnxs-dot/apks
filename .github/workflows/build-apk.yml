name: Build NDREXAN CINEMA APK

on:
workflow_dispatch:
push:
paths:
- 'NDREXAN_CINEMA_source.zip'
- '.github/workflows/build-apk.yml'

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4

  - name: Extract project ZIP
    run: |
      unzip -o NDREXAN_CINEMA_source.zip -d project
      echo "PROJECT_DIR=$GITHUB_WORKSPACE/project" >> "$GITHUB_ENV"

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Build APK
    working-directory: project
    run: |
      gradle assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: NDREXAN-CINEMA-APK
      path: project/app/build/outputs/apk/debug/*.apk
